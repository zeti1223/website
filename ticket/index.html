<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ticket</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial;
        background: #121212;
        color: #FFFFFF;
        margin: 0;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #1E1E1E;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 480px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        color: #FFFFFF;
        text-align: center;
      }
      label {
        display: block;
        margin-top: 14px;
        font-weight: 600;
        color: #FFFFFF;
      }
      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        margin-top: 6px;
        border: 1px solid #3E3E3E;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
        background: #2C2C2C;
        color: #FFFFFF;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      button {
        margin-top: 18px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        font-weight: 700;
        background: #BB86FC;
        color: #000000;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.2s ease-in-out;
      }
      button:hover {
        background: #9942ff;
      }

      .suggested-times {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .suggested-times button {
        flex: 1;
        padding: 8px;
        font-size: 14px;
        background: #333;
        color: #fff;
        border: 1px solid #555;
      }

      .suggested-times button:hover {
        background: #444;
      }

      .muted {
        color: #6b7280;
        font-size: 13px;
        margin-top: 8px;
        text-align: center;
      }
      .success {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #ecfccb;
        color: #166534;
        font-weight: 600;
        text-align: center;
      }
      .error {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #fee2e2;
        color: #7f1d1d;
        font-weight: 600;
        text-align: center;
      }
      .ticket-id {
        font-family: monospace;
        background: #f3f4f6;
        padding: 6px 8px;
        border-radius: 6px;
        display: inline-block;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Ticket</h1>

      <form id="ticketForm">
        <label for="name">Feladat</label>
        <input id="name" name="name" type="text" required />

        <label for="problem">Bővebben</label>
        <textarea id="problem" name="problem"></textarea>

        <label for="maxTime">Maximum időpont</label>
        <input type="datetime-local" id="maxTime" name="maxTime" required>
        <div class="suggested-times">
          <button type="button" data-time="15m">15 perc</button>
          <button type="button" data-time="1h">1 óra</button>
          <button type="button" data-time="1d">1 nap</button>
          <button type="button" data-time="1w">1 hét</button>
        </div>

        <button type="submit">Ticket küldése</button>
      </form>

      <div id="messageArea" aria-live="polite"></div>
    </div>

    <!-- Firebase (compat) CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
      // Firebase config
      const firebaseConfig = {
          apiKey: "AIzaSyA9pr29fe_2qOINUTnWdJxbLzcU4gRjttU",
          authDomain: "zeti1223.firebaseapp.com",
          databaseURL: "https://zeti1223-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "zeti1223",
          storageBucket: "zeti1223.firebasestorage.app",
          messagingSenderId: "556059487179",
          appId: "1:556059487179:web:eff9cd64fe2154de12244e",
          measurementId: "G-WFE315SDXZ"
      };

      // Initialize Firebase
      firebase.initializeApp(firebaseConfig);
      const database = firebase.database();


      const form = document.getElementById("ticketForm");
      const messageArea = document.getElementById("messageArea");
      const maxTimeInput = document.getElementById("maxTime");
      const suggestedTimesContainer = document.querySelector(".suggested-times");

      function showSuccess(text, ticketId) {
        messageArea.innerHTML = `<div class="success">${text}${ticketId ? '<div class="ticket-id">ID: ' + ticketId + "</div>" : ""}</div>`;
      }
      function showError(text) {
        messageArea.innerHTML = `<div class="error">${text}</div>`;
      }

      suggestedTimesContainer.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
          const time = e.target.dataset.time;
          const now = new Date();
          switch (time) {
            case '15m':
              now.setMinutes(now.getMinutes() + 15);
              break;
            case '1h':
              now.setHours(now.getHours() + 1);
              break;
            case '1d':
              now.setDate(now.getDate() + 1);
              break;
            case '1w':
              now.setDate(now.getDate() + 7);
              break;
          }
          const year = now.getFullYear();
          const month = (now.getMonth() + 1).toString().padStart(2, '0');
          const day = now.getDate().toString().padStart(2, '0');
          const hours = now.getHours().toString().padStart(2, '0');
          const minutes = now.getMinutes().toString().padStart(2, '0');
          maxTimeInput.value = `${year}-${month}-${day}T${hours}:${minutes}`;
        }
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        messageArea.innerHTML = "";

        const name = document.getElementById("name").value.trim();
        const problem = document.getElementById("problem").value.trim();
        const maxTime = maxTimeInput.value;

        if (!name || !maxTime) {
          showError("A feladat és a maximum időpont kitöltése kötelező.");
          return;
        }

        const maxTimeDate = new Date(maxTime);
        const now = new Date();

        const ticketObj = {
          name,
          problem,
          duration: maxTimeDate.getTime() - now.getTime(),
          maxTime: maxTimeDate.toISOString(),
        };

        try {
          // 1️⃣ Mentés Firebase-be
          const ticketsRef = database.ref("tickets");
          const newTicketRef = await ticketsRef.push(ticketObj);
          const ticketId = newTicketRef.key;

          showSuccess("✅ Ticket sikeresen elküldve!", ticketId);
          form.reset();
        } catch (err) {
          console.error(err);
          showError("Hoppá — valami elromlott. Próbáld meg később újra.");
        }
      });
    </script>
  </body>
</html>
