<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Feladatok</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial;
        background: #121212;
        color: #FFFFFF;
        margin: 0;
        padding: 20px;
      }
      h1 {
        text-align: center;
        color: #FFFFFF;
        margin-bottom: 20px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      #points-container {
        font-size: 1.5em;
        font-weight: bold;
        background: #2C2C2C;
        padding: 10px 20px;
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #1E1E1E;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
      }
      th,
      td {
        padding: 12px 16px;
        border-bottom: 1px solid #3E3E3E;
        text-align: left;
        font-size: 15px;
      }
      th {
        background: #2C2C2C;
        color: #FFFFFF;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tr:hover {
        background: #2C2C2C;
        cursor: pointer;
      }
      .swipe-row {
        transition: transform 0.2s ease-out;
      }
      .swipe-container {
        position: relative;
        overflow: hidden;
      }
      .swipe-content {
        position: relative;
        background: #1E1E1E;
        z-index: 1;
        transition: transform 0.1s ease-out;
      }
      .swipe-actions {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        font-weight: bold;
      }
      .swipe-action.left {
        background: #EF4444;
        padding-left: 20px;
      }
      .swipe-action.right {
        background: #10B981;
        padding-right: 20px;
        justify-content: flex-end;
        flex: 1;
        display: flex;
      }
      .status-open {
        color: #F472B6;
        font-weight: 700;
      }
      .status-done {
        color: #A7F3D0;
        font-weight: 700;
      }
      .status-late {
        color: #FBBF24;
        font-weight: 700;
      }
      .status-rejected {
        color: #F87171;
        font-weight: 700;
      }
      #rejectBtn {
        background: #EF4444;
      }
      #rejectBtn:hover {
        background: #DC2626;
      }      .progress-bar-container {
        width: 100%;
        background-color: #555;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-bar {
        width: 0;
        height: 10px;
        background-color: #4CAF50;
        transition: width 0.5s ease-in-out;
      }
      .container {
        max-width: 900px;
        margin: auto;
      }
      .empty {
        text-align: center;
        padding: 20px;
        color: #A0AEC0;
      }
      th.sort-asc::after {
        content: " ▲";
      }
      th.sort-desc::after {
        content: " ▼";
      }

      #countdown {
        text-align: center;
        font-size: 2em;
        margin-bottom: 20px;
        padding: 10px;
        background: #1E1E1E;
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
      }

      .countdown-h1 {
        text-align: center;
        color: #FFFFFF;
        margin-bottom: 20px;
      }

      /* Modal styling */
      .modal-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .modal {
        background: #1E1E1E;
        padding: 20px 24px;
        border-radius: 12px;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        animation: pop 0.2s ease;
      }
      @keyframes pop {
        from {
          transform: scale(0.9);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .modal h2 {
        margin-top: 0;
        color: #FFFFFF;
      }
      .modal p {
        color: #FFFFFF;
      }
      .modal pre {
        background: #2C2C2C;
        color: #FFFFFF;
        padding: 12px;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 250px;
        overflow: auto;
      }
      .modal-footer {
        margin-top: 16px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      button {
        background: #3b82f6;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 6px 10px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }
      button:hover {
        background: #2563eb;
      }
      .close-btn {
        background: #6b7280;
      }
      .close-btn:hover {
        background: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="countdown-h1">Feladatok</h1>
        <div id="points-container">Pontok: <span id="points">0</span></div>
      </div>
      <table id="ticketTable">
        <thead>
          <tr>
            <th>Név</th>
            <th id="sortStatus">Státusz</th>
            <th>Idővisszaszámláló</th>
          </tr>
        </thead>
        <tbody id="ticketBody">
          <tr>
            <td colspan="3" class="empty">Betöltés...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal -->
    <div class="modal-bg" id="modalBg">
      <div class="modal" id="modal">
        <h2 id="modalName">Név</h2>
        <p><strong>Ticket ID:</strong> <span id="modalId"></span></p>
        <p><strong>Státusz:</strong> <span id="modalStatus"></span></p>
        <p><strong>Bővebben:</strong></p>
        <pre id="modalProblem"></pre>
        <div class="modal-footer">
          <button class="close-btn" id="closeModal">Bezárás</button>
          <button id="rejectBtn" style="display: none">❌ Elutasítás</button>
          <button id="markDoneBtn" style="display: none">
            ✅ Készre jelölés
          </button>
        </div>
      </div>
    </div>

    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9pr29fe_2qOINUTnWdJxbLzcU4gRjttU",
            authDomain: "zeti1223.firebaseapp.com",
            databaseURL: "https://zeti1223-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "zeti1223",
            storageBucket: "zeti1223.firebasestorage.app",
            messagingSenderId: "556059487179",
            appId: "1:556059487179:web:eff9cd64fe2154de12244e",
            measurementId: "G-WFE315SDXZ"
        };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      const tableBody = document.getElementById("ticketBody");
      const modalBg = document.getElementById("modalBg");
      const modalName = document.getElementById("modalName");
      const modalId = document.getElementById("modalId");
      const modalProblem = document.getElementById("modalProblem");
      const modalStatus = document.getElementById("modalStatus");
      const closeModalBtn = document.getElementById("closeModal");
      const markDoneBtn = document.getElementById("markDoneBtn");
      const rejectBtn = document.getElementById("rejectBtn");
      const pointsEl = document.getElementById("points");

      const sortStatusBtn = document.getElementById("sortStatus");

      let currentTicketId = null;
      let allTickets = [];
      let sortField = "status";
      let sortDirection = "desc";
      let countdownIntervals = {};
      let totalPoints = 0;

      // Realtime listener for points
      const pointsRef = db.ref("points/total");
      pointsRef.on("value", (snapshot) => {
        totalPoints = snapshot.val() || 0;
        pointsEl.textContent = totalPoints;
      });

      // Realtime listener for tickets
      const ticketsRef = db.ref("tickets");
      ticketsRef.on("value", (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          allTickets = [];
          renderTable();
          return;
        }
        allTickets = Object.entries(data).map(([id, t]) => {
          const ticket = {
            id,
            name: t.name || "—",
            problem: t.problem || "",
            status: t.status || "open",
            maxTime: t.maxTime,
            duration: t.duration,
            createdAt: null // Default to null
          };

          if (t.maxTime && typeof t.duration === 'number') {
            ticket.createdAt = new Date(t.maxTime).getTime() - t.duration;
          } else if (t.createdAt) {
            ticket.createdAt = new Date(t.createdAt).getTime();
          }
          return ticket;
        });
        renderTable();
      });

      function markAsDone(ticket) {
        if (ticket.status === 'done' || ticket.status === 'late' || ticket.status === 'rejected') return;

        let pointsToAdd = 5;
        if (new Date().getTime() - ticket.createdAt < 5 * 60 * 1000) {
          pointsToAdd += 2;
        }

        pointsRef.set(totalPoints + pointsToAdd);
        db.ref("tickets/" + ticket.id).update({ status: "done" });
      }

      function rejectTask(ticket) {
        if (ticket.status === 'done' || ticket.status === 'late' || ticket.status === 'rejected') return;

        pointsRef.set(totalPoints - 15);
        db.ref("tickets/" + ticket.id).update({ status: "rejected" });
      }

      function renderTable() {
        Object.values(countdownIntervals).forEach(clearInterval);
        countdownIntervals = {};
        tableBody.innerHTML = "";

        if (allTickets.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="3" class="empty">Nincs ticket 🙌</td></tr>`;
          return;
        }

        // Rendezés
        allTickets.sort((a, b) => {
          if (sortField === "status") {
            const order = { open: 1, done: 2, late: 3, rejected: 4 };
            return sortDirection === "asc"
              ? order[a.status] - order[b.status]
              : order[b.status] - order[a.status];
          }
          return 0;
        });

        // Táblázat feltöltése
        for (const t of allTickets) {
          const row = document.createElement("tr");
          row.classList.add('swipe-row');
          const nameCell = document.createElement("td");
          const statusCell = document.createElement("td");
          const countdownCell = document.createElement("td");

          nameCell.textContent = t.name;

          if (t.status === "done") {
            statusCell.textContent = "Kész";
            statusCell.className = "status-done";
          } else if (t.status === "late") {
            statusCell.textContent = "Elkéstél ⚠️";
            statusCell.className = "status-late";
          } else if (t.status === "rejected") {
            statusCell.textContent = "Elutasítva";
            statusCell.className = "status-rejected";
          } else {
            statusCell.textContent = "Nyitott";
            statusCell.className = "status-open";
          }

          if (t.maxTime && t.createdAt && t.status !== 'done' && t.status !== 'late' && t.status !== 'rejected') {
            const countdownText = document.createElement('div');
            const progressBarContainer = document.createElement('div');
            const progressBar = document.createElement('div');

            progressBarContainer.className = 'progress-bar-container';
            progressBar.className = 'progress-bar';

            progressBarContainer.appendChild(progressBar);
            countdownCell.append(countdownText, progressBarContainer);

            startCountdown(t, countdownText, progressBar);
          }

          row.append(nameCell, statusCell, countdownCell);
          row.onclick = () => openModal(t);

          // Swipe logic
          let startX = 0;
          let diffX = 0;
          row.addEventListener('touchstart', (e) => {
            if (t.status !== 'open') return;
            startX = e.touches[0].clientX;
            row.style.transition = 'none';
          });

          row.addEventListener('touchmove', (e) => {
            if (t.status !== 'open') return;
            diffX = e.touches[0].clientX - startX;
            row.style.transform = `translateX(${diffX}px)`;
          });

          row.addEventListener('touchend', () => {
            if (t.status !== 'open') return;
            row.style.transition = 'transform 0.2s ease-out';
            if (diffX > 100) {
              markAsDone(t);
            } else if (diffX < -100) {
              rejectTask(t);
            } else {
              row.style.transform = 'translateX(0)';
            }
          });

          tableBody.appendChild(row);
        }

        // Oszlopfej rendezés ikonok kezelése
        document
          .querySelectorAll("th")
          .forEach((th) => th.classList.remove("sort-asc", "sort-desc"));
        if (sortField === "status")
          sortStatusBtn.classList.add(
            sortDirection === "asc" ? "sort-asc" : "sort-desc",
          );
      }

      function startCountdown(ticket, textElement, progressBar) {
        const maxTime = new Date(ticket.maxTime).getTime();
        const startTime = ticket.createdAt;

        const totalDuration = maxTime - startTime;
        if (totalDuration <= 0) {
            return;
        }

        const interval = setInterval(() => {
          const now = new Date().getTime();
          const distance = maxTime - now;

          if (distance < 0) {
            textElement.innerHTML = "Lejárt";
            progressBar.style.width = '0%';
            if (ticket.status !== 'done' && ticket.status !== 'late') {
              pointsRef.set(totalPoints - 10);
              db.ref("tickets/" + ticket.id).update({ status: "late" });
            }
            clearInterval(interval);
            return;
          }

          const remainingPercentage = (distance / totalDuration) * 100;
          progressBar.style.width = remainingPercentage + '%';

          const days = Math.floor(distance / (1000 * 60 * 60 * 24));
          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          textElement.innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
        }, 1000);

        countdownIntervals[ticket.id] = interval;
      }

      // Rendezes gombok
      sortStatusBtn.addEventListener("click", () => toggleSort("status"));

      function toggleSort(field) {
        if (sortField === field) {
          sortDirection = sortDirection === "asc" ? "desc" : "asc";
        } else {
          sortField = field;
          sortDirection = "asc";
        }
        renderTable();
      }

      // Modal megnyitása
      function openModal(ticket) {
        currentTicketId = ticket.id;
        modalName.textContent = ticket.name;
        modalId.textContent = ticket.id;
        if (ticket.status === "done") {
          modalStatus.textContent = "Kész ✅";
        } else if (ticket.status === "late") {
          modalStatus.textContent = "Elkéstél ⚠️";
        } else if (ticket.status === "rejected") {
          modalStatus.textContent = "Elutasítva ❌";
        } else {
          modalStatus.textContent = "Nyitott ❗";
        }
        modalProblem.textContent = ticket.problem || "(nincs megadva)";
        markDoneBtn.style.display =
          (ticket.status === "done" || ticket.status === 'late' || ticket.status === 'rejected') ? "none" : "inline-block";
        rejectBtn.style.display =
          (ticket.status === "done" || ticket.status === 'late' || ticket.status === 'rejected') ? "none" : "inline-block";
        modalBg.style.display = "flex";
      }

      // Modal bezárása
      closeModalBtn.addEventListener(
        "click",
        () => (modalBg.style.display = "none"),
      );
      modalBg.addEventListener("click", (e) => {
        if (e.target === modalBg) modalBg.style.display = "none";
      });

      // Készre jelölés
      markDoneBtn.addEventListener("click", () => {
        if (!currentTicketId) return;

        const ticket = allTickets.find(t => t.id === currentTicketId);
        if (!ticket) return;

        let pointsToAdd = 5;
        if (new Date().getTime() - ticket.createdAt < 5 * 60 * 1000) {
          pointsToAdd += 2;
        }

        pointsRef.set(totalPoints + pointsToAdd);
        db.ref("tickets/" + currentTicketId).update({ status: "done" });
        modalBg.style.display = "none";
      });

      // Elutasítás
      rejectBtn.addEventListener("click", () => {
        if (!currentTicketId) return;

        pointsRef.set(totalPoints - 15);
        db.ref("tickets/" + currentTicketId).update({ status: "rejected" });
        modalBg.style.display = "none";
      });
    </script>
  </body>
</html>
