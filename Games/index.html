<!DOCTYPE html>
<html>
  <head>
    <title>Games</title>
    <link rel="stylesheet" href="https://unpkg.com/@catppuccin/palette@latest/css/catppuccin.css">
    <link rel="website icon" type="png" href="Icon/main.png">

    <style>
      body {
        background-color: var(--ctp-mocha-base);
        color: var(--ctp-mocha-text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .menu {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        max-width: 300px;
      }
      a {
        background-color: var(--ctp-mocha-teal);
        color: var(--ctp-mocha-base);
        text-decoration: none;
        padding: 15px;
        border-radius: 12px;
        text-align: center;
        font-weight: bold;
        font-size: 1.1rem;
        transition: transform 0.2s;
      }
      a:hover {
        transform: scale(1.03);
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <a href="javascript:void(0);" onclick="history.back();">
        <p>Home</p>
      </a>
      <a href="Pac-Man/index.html">
        <p>Pac-Man</p>
      </a>
      <a href="2048/index.html">
        <p>2048</p>
      </a>

      <a href="Snake/index.html">
        <p>Snake</p>
      </a>
    </div>
    <script src="inspect.js"></script>
  </body>
</html>
