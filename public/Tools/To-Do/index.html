<!DOCTYPE html>
<html lang="hu">
<head>
  <title>To-Do List</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="website icon" type="image/png" href="../../Icon/main.png"/>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --text-main: #e3e3e3;
      --text-muted: #999999;
      --accent-purple: #6965db;
      --accent-teal: #12b886;
      --accent-orange: #ff922b;
      --accent-pink: #f06595;
      --shadow-offset: 4px 4px 0px #000000;
      --shadow-hover: 6px 6px 0px var(--accent-purple);
      --font-hand: 'Patrick Hand', cursive, sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      user-select: none;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-hand);
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: var(--shadow-offset);
      transition: all 0.2s ease;
      margin-bottom: 40px;
      align-self: flex-start;
    }

    .back-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent-purple);
      color: var(--accent-purple);
    }

    .back-btn i {
      font-size: 1rem;
    }



    h1 {
      font-family: var(--font-hand);
      font-size: 2.5rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 30px;
      color: var(--text-main);
    }

    h1 .highlight {
      color: var(--accent-purple);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 20px;
      margin: 8px 0;
      background-color: var(--card-bg);
      color: var(--text-main);
      box-sizing: border-box;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: var(--font-body);
      box-shadow: 3px 3px 0px #000;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 4px 4px 0px var(--accent-purple);
    }

    input[type="text"]::placeholder {
      color: var(--text-muted);
    }

    button#add-btn {
      background-color: var(--accent-teal);
      color: var(--text-main);
      width: 100%;
      padding: 14px 20px;
      margin: 8px 0;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      font-family: var(--font-hand);
      box-shadow: 3px 3px 0px #000;
      transition: all 0.2s ease;
    }

    button#add-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--accent-purple);
      border-color: var(--accent-purple);
    }

    ul {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    li {
      list-style-type: none;
      border: 2px solid var(--card-border);
      border-radius: 10px;
      background-color: var(--card-bg);
      font-size: 1.1rem;
      padding: 14px 50px 14px 16px;
      text-align: left;
      position: relative;
      word-wrap: break-word;
      box-shadow: 3px 3px 0px #000;
      transition: all 0.2s ease;
    }

    li:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--accent-purple);
      border-color: var(--accent-purple);
    }

    li span {
      font-weight: bold;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 10px;
      cursor: pointer;
      padding: 8px 12px;
      background: var(--accent-pink);
      color: var(--text-main);
      border-radius: 8px;
      font-family: var(--font-hand);
      font-size: 0.9rem;
      border: 2px solid var(--card-border);
      box-shadow: 2px 2px 0px #000;
      transition: all 0.2s ease;
    }

    li span:hover {
      transform: translateY(-50%) translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--accent-purple);
    }
  </style>
</head>

<body>
  <div class="container">
    <a href="../../index.html" class="back-btn">
      <i class="fas fa-arrow-left"></i>
      Back to Home
    </a>
    <h1><span class="highlight">To-Do</span> List</h1>
    <input type="text" placeholder="Enter a new task..." />
    <button id="add-btn">Add Task</button>
    <ul id="task-list">
    </ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      get,
      set,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9pr29fe_2qOINUTnWdJxbLzcU4gRjttU",
      authDomain: "zeti1223.firebaseapp.com",
      databaseURL: "https://zeti1223-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "zeti1223",
      storageBucket: "zeti1223.firebasestorage.app",
      messagingSenderId: "556059487179",
      appId: "1:556059487179:web:eff9cd64fe2154de12244e",
      measurementId: "G-WFE315SDXZ",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const username = localStorage.getItem("loggedInUser");

    const input = document.querySelector("input");
    const btn = document.querySelector("#add-btn");
    const taskList = document.querySelector("#task-list");

    async function loadTasksFromServer() {
      if (username) {
        try {
          const snapshot = await get(ref(db, "todo/" + username));
          if (snapshot.exists()) {
            const savedTasks = snapshot.val() || [];
            taskList.innerHTML = "";
            savedTasks.forEach(addTask);
          }
        } catch (error) {
          console.error("Error loading tasks from server:", error);
        }
      } else {
        const savedTasks = JSON.parse(localStorage.getItem("localTasks") || "[]");
        taskList.innerHTML = "";
        savedTasks.forEach(addTask);
      }
    }

    function addTask(text) {
      const newTask = document.createElement("li");
      const taskName = document.createTextNode(text);
      newTask.appendChild(taskName);

      const deleteBtn = document.createElement("span");
      const deleteText = document.createTextNode("Done");
      deleteBtn.className = "delete";
      deleteBtn.appendChild(deleteText);
      newTask.appendChild(deleteBtn);

      taskList.appendChild(newTask);
    }

    async function saveTasksToServer() {
      const tasks = [];
      taskList.querySelectorAll("li").forEach((task) => {
        tasks.push(task.firstChild.textContent);
      });
      
      if (username) {
        try {
          await set(ref(db, "todo/" + username), tasks);
        } catch (error) {
          console.error("Error saving tasks to server:", error);
        }
      } else {
        localStorage.setItem("localTasks", JSON.stringify(tasks));
      }
    }

    btn.addEventListener("click", async () => {
      if (input.value === "") return;
      addTask(input.value);
      await saveTasksToServer();
      input.value = "";
    });

    taskList.addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete")) {
        const parentTask = e.target.parentElement;
        taskList.removeChild(parentTask);
        await saveTasksToServer();
      }
    });

    input.addEventListener("keypress", async function (e) {
      if (e.key === "Enter") {
        if (input.value === "") return;
        addTask(input.value);
        await saveTasksToServer();
        input.value = "";
      }
    });

    loadTasksFromServer();
  </script>
</body>

</html>
