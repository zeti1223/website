<!doctype html>
<html>

<head>
  <title>To-Do List</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="website icon" type="png" href="../../Icon/todo.png" />
  <link rel="stylesheet" href="https://unpkg.com/@catppuccin/palette@latest/css/catppuccin.css" />
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      color: var(--ctp-mocha-text);
      font-size: 18px;
      background-color: var(--ctp-mocha-base);
      margin: 0;
      padding: 20px;
    }

    .header-actions {
      display: flex;
      justify-content: flex-end;
      max-width: 500px;
      margin: 0 auto 10px auto;
    }

    .logout-btn {
      background-color: var(--ctp-mocha-flamingo);
      color: var(--ctp-mocha-base);
      width: auto;
      padding: 8px 15px;
      font-size: 0.9rem;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      margin-top: 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      background-color: var(--ctp-mocha-surface1);
      color: var(--ctp-mocha-text);
      box-sizing: border-box;
      border: 2px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    button {
      background-color: var(--ctp-mocha-teal);
      width: 100%;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
    }

    button:hover {
      background: color-mix(in srgb, var(--ctp-mocha-teal) 80%, black);
    }

    ul {
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    li {
      list-style-type: none;
      border: 2px solid #ccc;
      border-radius: 4px;
      background-color: var(--ctp-mocha-surface1);
      font-size: 1.1rem;
      padding: 10px;
      padding-right: 50px;
      text-align: left;
      position: relative;
      word-wrap: break-word;
    }

    li span {
      font-weight: bold;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 10px;
      cursor: pointer;
      padding: 5px;
    }
  </style>
</head>

<body>
  <div class="header-actions">
    <button class="logout-btn" id="logout-btn">Logout</button>
  </div>
  <div class="container">
    <h1 id="welcome-title">To-Do List</h1>
    <input type="text" placeholder="Enter a new task..." />
    <button id="add-btn">Add</button>
    <ul id="task-list">
    </ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      get,
      set,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA9pr29fe_2qOINUTnWdJxbLzcU4gRjttU",
      authDomain: "zeti1223.firebaseapp.com",
      databaseURL: "https://zeti1223-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "zeti1223",
      storageBucket: "zeti1223.firebasestorage.app",
      messagingSenderId: "556059487179",
      appId: "1:556059487179:web:eff9cd64fe2154de12244e",
      measurementId: "G-WFE315SDXZ",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const username = localStorage.getItem("loggedInUser");
    if (!username) {
      window.location.href = "../../Login.html";
    } else {
      document.getElementById("welcome-title").textContent = `${username}'s To-Do List`;
    }

    const input = document.querySelector("input");
    const btn = document.querySelector("#add-btn");
    const taskList = document.querySelector("#task-list");
    const logoutBtn = document.getElementById("logout-btn");

    async function loadTasksFromServer() {
      try {
        const snapshot = await get(ref(db, "todo/" + username));
        if (snapshot.exists()) {
          const savedTasks = snapshot.val() || [];
          taskList.innerHTML = "";
          savedTasks.forEach(addTask);
        }
      } catch (error) {
        console.error("Error loading tasks from server:", error);
      }
    }

    function addTask(text) {
      const newTask = document.createElement("li");
      const taskName = document.createTextNode(text);
      newTask.appendChild(taskName);

      const deleteBtn = document.createElement("span");
      const deleteText = document.createTextNode("Done");
      deleteBtn.className = "delete";
      deleteBtn.appendChild(deleteText);
      newTask.appendChild(deleteBtn);

      taskList.appendChild(newTask);
    }

    async function saveTasksToServer() {
      const tasks = [];
      taskList.querySelectorAll("li").forEach((task) => {
        tasks.push(task.firstChild.textContent);
      });
      try {
        await set(ref(db, "todo/" + username), tasks);
      } catch (error) {
        console.error("Error saving tasks to server:", error);
      }
    }

    btn.addEventListener("click", async () => {
      if (input.value === "") return;
      addTask(input.value);
      await saveTasksToServer();
      input.value = "";
    });

    taskList.addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete")) {
        const parentTask = e.target.parentElement;
        taskList.removeChild(parentTask);
        await saveTasksToServer();
      }
    });

    input.addEventListener("keypress", async function (e) {
      if (e.key === "Enter") {
        if (input.value === "") return;
        addTask(input.value);
        await saveTasksToServer();
        input.value = "";
      }
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("loggedInUser");
      window.location.href = "../../Login.html";
    });

    loadTasksFromServer();
  </script>
</body>

</html>
