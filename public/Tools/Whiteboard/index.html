<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="website icon" type="image/png" href="../../Icon/whiteboard.png" />
  </head>

  <body>
    <a href="../../index.html" class="back-home-btn">
      <i class="fas fa-arrow-left"></i>
      Back to Home
    </a>
    <div class="container">
      <h1 class="title">Virtual Whiteboard</h1>
        <div class="canvas-container">
          <div class="canvas-wrapper">
            <canvas id="whiteboard" width="700" height="500"></canvas>
          </div>
          <div class="canvas-controls">
            <button id="clearBtn" class="btn btn-danger">
              <i class="fas fa-trash"></i> Clear
            </button>
            <button id="eraserBtn" class="btn btn-warning">
              <i class="fas fa-eraser"></i> Eraser
            </button>
          </div>
        </div>
        <div class="tools-row">
          <div class="tool-select">
            <label for="toolSelect"><i class="fas fa-pen"></i> Tool:</label>
            <select id="toolSelect">
              <option value="pen">Pen</option>
              <option value="line">Line</option>
              <option value="rectangle">Rectangle</option>
              <option value="circle">Circle</option>
              <option value="text">Text</option>
            </select>
          </div>
          <div class="action-buttons">
            <button id="saveBtn" class="btn btn-success">
              <i class="fas fa-save"></i> Save
            </button>
            <input type="file" id="imageInput" accept="image/*" class="hidden" />
            <button id="imageBtn" class="btn btn-orange">
              <i class="fas fa-image"></i> Insert Image
            </button>
          </div>
        </div>
        <div id="textInput" class="text-input-container hidden">
          <input type="text" id="textBox" placeholder="Enter text..." />
          <button id="textBtn" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Text
          </button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="../../inspect.js"></script>
  </body>
</html>
