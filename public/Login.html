<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Login</title>
  <link rel="stylesheet" href="https://unpkg.com/@catppuccin/palette@latest/css/catppuccin.css" />
  <link rel="website icon" type="png" href="Icon/login.png" />
  <style>
    body {
      background-color: var(--ctp-mocha-base);
      color: var(--ctp-mocha-text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background-color: var(--ctp-mocha-surface0);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    h2 {
      margin-bottom: 20px;
    }

    .form-control {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--ctp-mocha-text);
      background-color: var(--ctp-mocha-surface1);
      color: var(--ctp-mocha-text);
      border-radius: 5px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button[type="submit"] {
      background-color: var(--ctp-mocha-teal);
      color: var(--ctp-mocha-base);
    }

    button[type="submit"]:hover {
      background: color-mix(in srgb, var(--ctp-mocha-teal) 80%, black);
    }

    .switch-btn {
      background-color: transparent;
      color: var(--ctp-mocha-flamingo);
      text-decoration: underline;
      font-size: 14px;
    }

    #status-message {
      margin-top: 10px;
      font-weight: bold;
    }

    .error {
      color: var(--ctp-mocha-red);
    }

    .success {
      color: var(--ctp-mocha-green);
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2 id="form-title">Login</h2>
    <form id="auth-form">
      <div class="form-control">
        <label for="username">Username</label>
        <input type="text" id="username" required />
      </div>
      <div class="form-control">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>
      <div class="btn-container">
        <button type="submit" id="submit-btn">Login</button>
        <button type="button" class="switch-btn" id="switch-mode-btn">Need an account? Register</button>
      </div>
    </form>
    <p id="status-message"></p>
  </div>
  <script type="module" src="Login-script.js"></script>
  <script src="inspect.js"></script>
</body>

</html>
