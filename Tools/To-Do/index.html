<!DOCTYPE html>
<html>

<head>
	<title>To-Do List</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="website icon" type="png" href="../../Icon/todo.png">
	<link rel="stylesheet" href="https://unpkg.com/@catppuccin/palette@latest/css/catppuccin.css">
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			text-align: center;
			color: var(--ctp-mocha-text);
			font-size: 18px;
			background-color: var(--ctp-mocha-base);
			margin: 0;
			padding: 20px;
		}

		.container {
			max-width: 500px;
			margin: 0 auto;
			text-align: center;
			width: 100%;
			box-sizing: border-box;
		}

		h1 {
			font-size: 2rem;
			margin-top: 0;
		}

		input[type="text"] {
			width: 100%;
			padding: 12px 20px;
			margin: 8px 0;
			background-color: var(--ctp-mocha-surface1);
			color: var(--ctp-mocha-text);
			box-sizing: border-box;
			border: 2px solid #ccc;
			border-radius: 4px;
			font-size: 1rem;
		}

		button {
			background-color: var(--ctp-mocha-teal);
			width: 100%;
			padding: 14px 20px;
			margin: 8px 0;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			font-size: 1.1rem;
			font-weight: bold;
		}

		ul {
			padding: 0;
			display: flex;
			flex-direction: column;
			gap: 5px;
		}

		li {
			list-style-type: none;
			border: 2px solid #ccc;
			border-radius: 4px;
			background-color: var(--ctp-mocha-surface1);
			font-size: 1.1rem;
			padding: 10px;
			padding-right: 50px;
			text-align: left;
			position: relative;
			word-wrap: break-word;
		}

		li span {
			font-weight: bold;
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			right: 10px;
			cursor: pointer;
			padding: 5px;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>To-Do List</h1>
		<input type="text" placeholder="Enter a new task...">
		<button>Add</button>
		<ul id="task-list">
			<!-- tasks will be added dynamically here -->
		</ul>
	</div>
	<script>
		const input = document.querySelector('input');
		const btn = document.querySelector('button');
		const taskList = document.querySelector('#task-list');

		const savedTasks = JSON.parse(localStorage.getItem('tasks')) || [];
		savedTasks.forEach(addTask);

		function addTask(text) {
			const newTask = document.createElement('li');
			const taskName = document.createTextNode(text);
			newTask.appendChild(taskName);

			const deleteBtn = document.createElement('span');
			const deleteText = document.createTextNode('✅');
			deleteBtn.className = 'delete';
			deleteBtn.appendChild(deleteText);
			newTask.appendChild(deleteBtn);

			taskList.appendChild(newTask);
		}

		function saveTasks() {
			const tasks = [];
			taskList.querySelectorAll('li').forEach(task => {
				tasks.push(task.firstChild.textContent);
			});
			localStorage.setItem('tasks', JSON.stringify(tasks));
		}

		btn.addEventListener('click', () => {
			if (input.value === '') return;
			addTask(input.value);
			saveTasks();
			input.value = '';
		});

		taskList.addEventListener('click', e => {
			if (e.target.classList.contains('delete')) {
				const parentTask = e.target.parentElement;
				taskList.removeChild(parentTask);
				saveTasks();
			}
		});

		input.addEventListener('keypress', function (e) {
			if (e.key === 'Enter') {
				if (input.value === '') return;
				addTask(input.value);
				saveTasks();
				input.value = '';
			}
		});	
	</script>
</body>

</html>
